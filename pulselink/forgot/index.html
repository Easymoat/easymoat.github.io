<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — PulseLink | Easymoat</title>
<link rel="icon" type="image/png" href="../../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F9FC; --white: #FFFFFF; --border: #E2E6EF;
    --accent: #0891B2; --accent-light: #CFFAFE; --accent-dark: #0E7490;
    --text: #111827; --text2: #374151; --muted: #6B7280; --muted2: #9CA3AF;
    --danger: #DC2626; --success: #16A34A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
  .lang-bar { background: var(--white); border-bottom: 1px solid var(--border); padding: 8px 40px; display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .lang-btn { padding: 4px 12px; border-radius: 4px; border: 1px solid var(--border); background: transparent; font-size: 13px; font-family: 'Inter', sans-serif; cursor: pointer; color: var(--muted); transition: all 0.15s; }
  .lang-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .lang-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
  nav { background: var(--white); border-bottom: 1px solid var(--border); padding: 16px 40px; display: flex; align-items: center; }
  main { flex: 1; max-width: 460px; margin: 0 auto; padding: 48px 24px; width: 100%; }
  .card { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 32px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
  h1 { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
  input { width: 100%; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.15s; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(8,145,178,0.12); }
  .btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s; margin-top: 8px; }
  .btn:hover { background: var(--accent-dark); }
  .btn:disabled { background: var(--muted2); cursor: not-allowed; }
  .alert { padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
  .alert.error { background: #FEF2F2; color: var(--danger); border: 1px solid #FECACA; }
  .alert.success { background: #F0FDF4; color: var(--success); border: 1px solid #BBF7D0; }
  .alert.success code { background: rgba(0,0,0,0.05); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  .footer-links { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }
  .footer-links a { color: var(--accent); text-decoration: none; margin: 0 8px; }
  footer { background: var(--white); border-top: 1px solid var(--border); padding: 20px 40px; text-align: center; font-size: 12px; color: var(--muted2); }
</style>
</head>
<body>
<div class="lang-bar">
  <span>🌐</span>
  <button class="lang-btn active" onclick="setLang('en')" id="btn-en">English</button>
  <button class="lang-btn" onclick="setLang('ja')" id="btn-ja">日本語</button>
</div>
<nav>
  <a href="../" style="display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit;">
    <img src="../../easymoat_logo.png" alt="Easymoat" style="height:32px; width:32px; border-radius:6px; object-fit:cover;">
    <span style="color:var(--accent); font-family:'Syne',sans-serif; font-weight:800; font-size:20px;">PulseLink</span>
  </a>
</nav>
<main>
  <div class="card">
    <h1 data-en="Reset your password" data-ja="パスワードの再設定">Reset your password</h1>
    <p class="subtitle" data-en="Enter the email you used to register. We'll send a reset link valid for 1 hour." data-ja="登録に使用したメールアドレスを入力してください。1時間有効なリセットリンクをお送りします。">Enter the email you used to register. We'll send a reset link valid for 1 hour.</p>

    <div id="alert" style="display:none;"></div>

    <form id="forgot-form">
      <div class="field">
        <label for="email" data-en="Email" data-ja="メールアドレス">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <button class="btn" type="submit" id="submit-btn" data-en="Send reset link" data-ja="リセットリンクを送信">Send reset link</button>
    </form>

    <div class="footer-links">
      <a href="../register/" data-en="Create account" data-ja="アカウント作成">Create account</a> · <a href="../" data-en="← PulseLink home" data-ja="← PulseLink ホーム">← PulseLink home</a>
    </div>
  </div>
</main>
<footer>© 2026 Easymoat. <a href="../" style="color:var(--accent); text-decoration:none;" data-en="PulseLink home" data-ja="PulseLink ホーム">PulseLink home</a></footer>

<script>
const API = 'https://mlbwatch-server.onrender.com/api/pulselink';
var LANG = 'en';
function T(en, ja) { return LANG === 'ja' ? ja : en; }

function setLang(lang) {
  LANG = (lang === 'ja') ? 'ja' : 'en';
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-en]').forEach(function (el) {
    if (el.children.length > 0) return;
    var t = el.getAttribute('data-' + LANG);
    if (t != null) el.textContent = t;
  });
  document.getElementById('btn-en').classList.toggle('active', LANG === 'en');
  document.getElementById('btn-ja').classList.toggle('active', LANG === 'ja');
  try { localStorage.setItem('pl_lang', LANG); } catch (e) {}
}

const form = document.getElementById('forgot-form');
const alertEl = document.getElementById('alert');
const submitBtn = document.getElementById('submit-btn');

function showAlert(kind, html) {
  alertEl.className = 'alert ' + kind;
  alertEl.innerHTML = html;
  alertEl.style.display = 'block';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  alertEl.style.display = 'none';
  const email = document.getElementById('email').value.trim();
  if (!email) return;
  submitBtn.disabled = true;
  submitBtn.textContent = T('Sending…', '送信中…');
  try {
    const res = await fetch(API + '/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    if (res.ok) {
      form.style.display = 'none';
      if (LANG === 'ja') {
        showAlert('success',
          '<strong>受信箱をご確認ください。</strong><br>' +
          '<code>' + escapeHtml(email) + '</code> のアカウントが存在する場合、' +
          '1時間で失効するリセットリンクをお送りしました。迷惑メールフォルダもご確認ください。'
        );
      } else {
        showAlert('success',
          '<strong>Check your inbox.</strong><br>' +
          'If an account exists for <code>' + escapeHtml(email) + '</code>, ' +
          'we\'ve sent a reset link that expires in 1 hour. ' +
          'Don\'t forget to check the spam folder.'
        );
      }
    } else {
      showAlert('error', T('Request failed. Please try again.', 'リクエストに失敗しました。もう一度お試しください。'));
    }
  } catch (e) {
    showAlert('error', T('Network error. Please check your connection.', '通信エラー。接続を確認してください。'));
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = T('Send reset link', 'リセットリンクを送信');
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
}

(function () {
  var saved = 'en';
  try { saved = localStorage.getItem('pl_lang') || 'en'; } catch (e) {}
  setLang(saved);
})();
</script>
</body>
</html>
