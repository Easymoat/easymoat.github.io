<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heat Stress 注釈エディタ</title>
<style>
  :root { --accent:#0891B2; --accent2:#DB2777; --border:#E2E6EF; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, 'Inter', sans-serif; background:#F8F9FC; color:#111827; margin:0; padding:24px; }
  h1 { font-size:18px; margin:0 0 6px; }
  p.help { font-size:13px; color:#6B7280; margin:0 0 16px; line-height:1.6; }
  /* マニュアルと同じ表示サイズにするため縦積み（figure を縮ませない＝stage 480px 固定）。 */
  .row { display:block; }
  .panel { margin-top:20px; }
  /* ── manual の figure.annotated と同じ見た目 ── */
  figure.annotated {
    background:#fff; border:1px solid var(--border); border-radius:12px;
    padding:24px 80px; margin:0; box-shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
    width:640px; max-width:100%;
  }
  figure.annotated .stage { position:relative; max-width:480px; margin:0 auto; }
  figure.annotated .stage::before { content:''; display:block; padding-bottom:100%; }
  figure.annotated .stage img {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; border-radius:50%; background:#111;
  }
  svg.overlay {
    position:absolute; top:-24px; bottom:-24px; left:-80px; right:-80px;
    width:auto; height:auto; overflow:visible;
  }
  svg.overlay line { stroke:var(--accent); stroke-width:1.5; }
  svg.overlay rect.box { fill:none; stroke:var(--accent2); stroke-width:2; stroke-dasharray:4 3; cursor:move; }
  svg.overlay text.lbl {
    fill:#111; font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    paint-order:stroke; stroke:#fff; stroke-width:4px; stroke-linejoin:round; cursor:move;
  }
  svg.overlay circle.h { fill:var(--accent); opacity:.55; cursor:grab; }
  svg.overlay circle.h:hover { opacity:.9; }
  svg.overlay circle.rh { fill:var(--accent2); opacity:.6; cursor:nwse-resize; }
  svg.overlay circle.rh:hover { opacity:.95; }
  .panel { flex:1; min-width:320px; }
  textarea { width:100%; height:340px; font-family:'SF Mono',monospace; font-size:12px; border:1px solid var(--border); border-radius:8px; padding:10px; }
  button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 16px; font-weight:600; cursor:pointer; font-size:14px; }
  .lang { margin-bottom:8px; }
  .lang button { background:transparent; color:var(--accent); border:1px solid var(--border); padding:4px 10px; }
  .lang button.on { background:var(--accent); color:#fff; }
  .hint { font-size:12px; color:#6B7280; margin:6px 0; }
</style>
</head>
<body>
  <h1>Heat Stress 注釈エディタ</h1>
  <p class="help">
    ピンクの<b>枠</b>・水色の<b>丸ハンドル（引き出し線の指す先）</b>・<b>ラベル文字</b>をドラッグして調整 →
    右の SVG をコピーして貼り付けてください。線は「指す先（丸）→ ラベル」を結びます。
  </p>
  <div class="lang">
    <button id="lEn" class="on" onclick="setLang('en')">English</button>
    <button id="lJa" onclick="setLang('ja')">日本語</button>
  </div>
  <div class="row">
    <figure class="annotated">
      <div class="stage">
        <img src="screens/heat.png" alt="Heat Stress">
        <svg id="svg" class="overlay" viewBox="0 0 454 454" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </figure>
    <div class="panel">
      <button onclick="copyOut()">SVG をコピー</button>
      <span class="hint" id="copied"></span>
      <p class="hint">下のテキストをそのまま私（チャット）に貼り付けてください。</p>
      <textarea id="out" readonly></textarea>
    </div>
  </div>

<script>
var LANG='en';
// 各注釈: rect=[x,y,w,h](無ければnull), t=[targetX,targetY](線の指す先), l=[labelX,labelY](線のラベル側端),
//          tx,ty=文字位置, en/ja=ラベル
var A = [
 {c:'Monitor toggle',  en:'Monitor toggle (tap / START)', ja:'Monitor 切替（タップ / START）', rect:[150,20,160,27], t:[152,33], l:[64,16], tx:-30, ty:12},
 {c:'Heat tier + WBGT',en:'Heat tier + est. WBGT', ja:'暑熱段階 + 推定WBGT',          rect:[128,102,200,122], t:[328,140], l:[430,78], tx:355, ty:70},
 {c:'Advice',          en:'Advice (scrolls if long)', ja:'アドバイス（長文はスクロール）', rect:null,         t:[110,258], l:[8,332],  tx:-34, ty:350},
 {c:'HR / %HRR',       en:'Your HR + %HRR', ja:'自分の HR + %HRR',                  rect:null,         t:[300,338], l:[420,358], tx:352, ty:375},
];

var svg = document.getElementById('svg');
var SVGNS='http://www.w3.org/2000/svg';
function el(n,at){ var e=document.createElementNS(SVGNS,n); for(var k in at) e.setAttribute(k,at[k]); return e; }

function render(){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  A.forEach(function(a,i){
    if(a.rect){
      var r=el('rect',{class:'box', x:a.rect[0], y:a.rect[1], width:a.rect[2], height:a.rect[3]});
      r.addEventListener('pointerdown', start(i,'rect')); svg.appendChild(r);
      var rh=el('circle',{class:'rh', cx:a.rect[0]+a.rect[2], cy:a.rect[1]+a.rect[3], r:7});
      rh.addEventListener('pointerdown', start(i,'resize')); svg.appendChild(rh);
    }
    svg.appendChild(el('line',{x1:a.t[0],y1:a.t[1],x2:a.l[0],y2:a.l[1]}));
    var t=el('text',{class:'lbl', x:a.tx, y:a.ty}); t.textContent=a[LANG];
    t.addEventListener('pointerdown', start(i,'text')); svg.appendChild(t);
    var h=el('circle',{class:'h', cx:a.t[0], cy:a.t[1], r:7});
    h.addEventListener('pointerdown', start(i,'target')); svg.appendChild(h);
  });
  output();
}
var drag=null;
function svgPt(e){ var p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function start(i,part){ return function(e){ e.preventDefault(); var p=svgPt(e); var a=A[i];
  drag={i:i,part:part,sx:p.x,sy:p.y,o:{rect:a.rect?a.rect.slice():null,t:a.t.slice(),l:a.l.slice(),tx:a.tx,ty:a.ty}};
  e.target.setPointerCapture(e.pointerId); };
}
svg.addEventListener('pointermove', function(e){ if(!drag) return; var p=svgPt(e); var dx=p.x-drag.sx, dy=p.y-drag.sy; var a=A[drag.i], o=drag.o;
  if(drag.part==='rect'){ a.rect=[o.rect[0]+dx,o.rect[1]+dy,o.rect[2],o.rect[3]]; }
  else if(drag.part==='target'){ a.t=[o.t[0]+dx,o.t[1]+dy]; }
  else if(drag.part==='text'){ a.tx=o.tx+dx; a.ty=o.ty+dy; a.l=[o.l[0]+dx,o.l[1]+dy]; }
  else if(drag.part==='resize'){ a.rect=[o.rect[0],o.rect[1],Math.max(20,o.rect[2]+dx),Math.max(16,o.rect[3]+dy)]; }
  render();
});
svg.addEventListener('pointerup', function(){ drag=null; });
svg.addEventListener('pointercancel', function(){ drag=null; });

function R(n){ return Math.round(n); }
function output(){
  var s='          <svg class="overlay" viewBox="0 0 454 454" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">\n';
  A.forEach(function(a){
    s+='            <!-- '+a.c+' -->\n';
    if(a.rect) s+='            <rect class="box" x="'+R(a.rect[0])+'" y="'+R(a.rect[1])+'" width="'+R(a.rect[2])+'" height="'+R(a.rect[3])+'"/>\n';
    s+='            <line x1="'+R(a.t[0])+'" y1="'+R(a.t[1])+'" x2="'+R(a.l[0])+'" y2="'+R(a.l[1])+'"/>\n';
    s+='            <text x="'+R(a.tx)+'" y="'+R(a.ty)+'" data-en="'+a.en+'" data-ja="'+a.ja+'">'+a.en+'</text>\n';
  });
  s+='          </svg>';
  document.getElementById('out').value=s;
}
function setLang(l){ LANG=l; document.getElementById('lEn').className=l==='en'?'on':''; document.getElementById('lJa').className=l==='ja'?'on':''; render(); }
function copyOut(){ var t=document.getElementById('out'); t.select(); document.execCommand('copy'); document.getElementById('copied').textContent='コピーしました'; setTimeout(function(){document.getElementById('copied').textContent='';},1500); }
render();
</script>
</body>
</html>
